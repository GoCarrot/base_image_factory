---
- hosts: all
  become: yes

  vars:
    build_environment: development

  pre_tasks:
    # bullseye-security moved to archive.debian.org after Debian 11 LTS ended, so
    # security.debian.org 404s on every deb11uN package. This is a raw task so it
    # works before ansible's apt module has bootstrapped python3-apt, which it
    # does before honoring update_cache.
    - name: Point bullseye-security at archive.debian.org and refresh apt
      raw: |
        set -e
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] || continue
          sed -i -E 's#https?://(security|deb)\.debian\.org/debian-security#http://archive.debian.org/debian-security#g' "$f"
        done
        DEBIAN_FRONTEND=noninteractive apt-get update
      changed_when: true

    - include_vars: "{{ item }}"
      with_first_found:
        - "vars_{{ build_environment }}.yml"
        - "vars_default.yml"

- import_playbook: newrelic.yml
- import_playbook: ruby_services.yml
- import_playbook: finalize_system.yml
